BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-aquila-ti-staging"
BBFILE_PATTERN_meta-aquila-ti-staging = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-aquila-ti-staging = "30"

# Persistent systemd journal — /var/log on disk, not tmpfs
VOLATILE_LOG_DIR = "no"

LAYERDEPENDS_meta-aquila-ti-staging = "core toradex-ti-layer meta-ti-bsp"
LAYERSERIES_COMPAT_meta-aquila-ti-staging = "scarthgap"

# Switch aquila-am69 from linux-toradex-ti to the upstream TI staging kernel 6.12.
# aquila-am69.conf hard-assigns linux-toradex-ti and TI_PREFERRED_BSP=ti-6_6 with
# plain '=' assignments; machine overrides here win per BitBake override resolution.
# TI_PREFERRED_BSP=ti-6_12 drives kernel 6.12%, u-boot 2025.01, and GPU driver
# versions via meta-ti-bsp/ti-bsp.inc — no explicit PREFERRED_VERSION needed.
PREFERRED_PROVIDER_virtual/kernel:aquila-am69 = "linux-ti-staging"
TI_PREFERRED_BSP:aquila-am69 = "ti-6_12"

# Switch bootloader from u-boot-toradex-ti to upstream u-boot-ti-staging 2025.01.
# Both aquila-am69.conf and aquila-am69-k3r5.conf hard-assign u-boot-toradex-ti;
# machine overrides here win per BitBake override resolution rules.
PREFERRED_PROVIDER_virtual/bootloader:aquila-am69 = "u-boot-ti-staging"
PREFERRED_PROVIDER_u-boot:aquila-am69 = "u-boot-ti-staging"
PREFERRED_PROVIDER_virtual/bootloader:aquila-am69-k3r5 = "u-boot-ti-staging"
PREFERRED_PROVIDER_u-boot:aquila-am69-k3r5 = "u-boot-ti-staging"

# aquila-am69.conf sets UBOOT_CONFIG ??= "sd", which the image recipe sees even
# though the u-boot recipe has UBOOT_CONFIG:aquila-am69 = "" (recipe-scope only).
# image_type_tezi.bbclass computes UBOOT_ENV_TEZI from UBOOT_CONFIG, so it looks
# for u-boot-initial-env-sd — a file our single-config build never generates.
# Override here (global scope) so the image class finds u-boot-initial-env instead.
UBOOT_ENV_TEZI:aquila-am69 = "u-boot-ti-staging-initial-env"
