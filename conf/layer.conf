BBPATH .= ":${LAYERDIR}"

BBFILES += ""

BBFILE_COLLECTIONS += "meta-aquila-ti-staging"
BBFILE_PATTERN_meta-aquila-ti-staging = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-aquila-ti-staging = "30"

LAYERDEPENDS_meta-aquila-ti-staging = "core toradex-ti-layer meta-ti-bsp"
LAYERSERIES_COMPAT_meta-aquila-ti-staging = "scarthgap"

# Switch aquila-am69 from linux-toradex-ti to the upstream TI staging kernel.
# aquila-am69.conf hard-assigns linux-toradex-ti with a plain '='; using the
# :aquila-am69 machine override here wins per BitBake override resolution rules.
# TI_PREFERRED_BSP = "ti-6_6" (set in aquila-am69.conf) configures the rest of
# the TI BSP components (u-boot-ti-staging, GPU drivers) via meta-ti-bsp/ti-bsp.inc.
PREFERRED_PROVIDER_virtual/kernel:aquila-am69 = "linux-ti-staging"
PREFERRED_VERSION_linux-ti-staging:aquila-am69 = "6.6%"
